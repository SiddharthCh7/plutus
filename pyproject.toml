[project]
name = "plutus"
version = "0.1.0"
description = "Personal Financial Portfolio Manager - Multi-Agent AI System"
readme = "README.md"
authors = [
    { name = "SiddharthCh7", email = "siddharth070504@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # LangGraph & LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    
    # Vector Store
    "qdrant-client>=1.12.0",
    
    # Observability
    "langfuse>=2.0.0",
    
    # Data & API
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    
    # Data Models
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Logging
    "structlog>=24.0.0",
    
    # Config & Environment
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    
    # CLI & Display
    "rich>=13.0.0",
    "typer>=0.12.0",
    
    # Scheduling
    "apscheduler>=3.10.0",
    
    # Email
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
plutus = "plutus.main:app"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
